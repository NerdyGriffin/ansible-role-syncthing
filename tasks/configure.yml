---
# Configure Syncthing daemon settings via CLI

- name: Get current GUI enabled state
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: syncthing cli config gui enabled get
  environment:
    HOME: "/home/{{ syncthing_user }}"
  register: syncthing_gui_current
  changed_when: false

- name: Set GUI enabled/disabled
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: >
      syncthing cli config gui enabled set
      {{ syncthing_gui_enabled | lower }}
  environment:
    HOME: "/home/{{ syncthing_user }}"
  when: syncthing_gui_current.stdout | trim | lower != syncthing_gui_enabled | lower
  changed_when: true
  notify: Restart syncthing

- name: Get current GUI/API listen address
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: syncthing cli config gui raw-address get
  environment:
    HOME: "/home/{{ syncthing_user }}"
  register: syncthing_address_current
  changed_when: false

- name: Set GUI/API listen address
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: >
      syncthing cli config gui raw-address set
      {{ syncthing_api_address }}
  environment:
    HOME: "/home/{{ syncthing_user }}"
  when: syncthing_address_current.stdout | trim != syncthing_api_address
  changed_when: true
  notify: Restart syncthing

- name: Get current API key
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: syncthing cli config gui apikey get
  environment:
    HOME: "/home/{{ syncthing_user }}"
  register: syncthing_apikey_current
  changed_when: false
  no_log: true

- name: Set API key
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: >
      syncthing cli config gui apikey set
      {{ syncthing_api_key }}
  environment:
    HOME: "/home/{{ syncthing_user }}"
  when:
    - syncthing_api_key | length > 0
    - syncthing_apikey_current.stdout | trim != syncthing_api_key
  changed_when: true
  no_log: true
  notify: Restart syncthing

# --- Connection / discovery toggles (LAN-only hardening when disabled) ---
# natenabled = UPnP/NAT-PMP router port mapping; global-ann-enabled = announce
# to public discovery servers; relays-enabled = connect via public relays.
- name: Get current NAT/UPnP (natenabled) state
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: syncthing cli config options natenabled get
  environment:
    HOME: "/home/{{ syncthing_user }}"
  register: syncthing_nat_current
  changed_when: false

- name: Set NAT/UPnP (natenabled) state
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: >
      syncthing cli config options natenabled set
      {{ syncthing_nat_enabled | lower }}
  environment:
    HOME: "/home/{{ syncthing_user }}"
  when: syncthing_nat_current.stdout | trim | lower != syncthing_nat_enabled | lower
  changed_when: true
  notify: Restart syncthing

- name: Get current global discovery (global-ann-enabled) state
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: syncthing cli config options global-ann-enabled get
  environment:
    HOME: "/home/{{ syncthing_user }}"
  register: syncthing_global_ann_current
  changed_when: false

- name: Set global discovery (global-ann-enabled) state
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: >
      syncthing cli config options global-ann-enabled set
      {{ syncthing_global_announce_enabled | lower }}
  environment:
    HOME: "/home/{{ syncthing_user }}"
  when: syncthing_global_ann_current.stdout | trim | lower != syncthing_global_announce_enabled | lower
  changed_when: true
  notify: Restart syncthing

- name: Get current relays (relays-enabled) state
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: syncthing cli config options relays-enabled get
  environment:
    HOME: "/home/{{ syncthing_user }}"
  register: syncthing_relays_current
  changed_when: false

- name: Set relays (relays-enabled) state
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: >
      syncthing cli config options relays-enabled set
      {{ syncthing_relays_enabled | lower }}
  environment:
    HOME: "/home/{{ syncthing_user }}"
  when: syncthing_relays_current.stdout | trim | lower != syncthing_relays_enabled | lower
  changed_when: true
  notify: Restart syncthing

- name: Ensure shared folder paths exist
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ syncthing_user }}"
    group: "{{ syncthing_user }}"
    mode: "0755"
  loop: "{{ syncthing_folders }}"

- name: Get existing folder IDs
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: syncthing cli config folders list
  environment:
    HOME: "/home/{{ syncthing_user }}"
  register: syncthing_existing_folders
  changed_when: false

- name: Configure shared folders
  become: true
  become_user: "{{ syncthing_user }}"
  ansible.builtin.command:
    cmd: >
      syncthing cli config folders add
      --id {{ item.id }}
      --path {{ item.path }}
  environment:
    HOME: "/home/{{ syncthing_user }}"
  loop: "{{ syncthing_folders }}"
  when: item.id not in syncthing_existing_folders.stdout_lines
  changed_when: true

# Syncthing never replicates a folder's own .stignore (ignore patterns are
# per-device local config), so a freshly-paired device starts with no ignores.
# Seed it from the folder's optional `stignore` value. force: false — create
# only when absent, never clobber a device's local additions. A common pattern
# is to point this stub at a synced shared file: `#include .stignore.shared`.
- name: Seed per-folder .stignore (create only; never overwrite device-local edits)
  become: true
  ansible.builtin.copy:
    dest: "{{ item.path }}/.stignore"
    content: "{{ item.stignore }}"
    owner: "{{ syncthing_user }}"
    group: "{{ syncthing_user }}"
    mode: "0644"
    force: false
  loop: "{{ syncthing_folders }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.stignore is defined
